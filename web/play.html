<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loading…</title>
<link rel="icon" href="app-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; position: fixed; left: 0; top: 0; outline: none; image-rendering: pixelated;
           touch-action: none; transform-origin: 0 0; }
  /* stop iPad's long-press text selection, magnifier and callout menu */
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
         -webkit-tap-highlight-color: transparent; }
  .touch-ring { position: fixed; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
                border: 3px solid rgba(255,255,255,.9); box-shadow: 0 0 0 2px rgba(0,0,0,.5);
                pointer-events: none; animation: touch-ring .4s ease-out forwards; }
  @keyframes touch-ring { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.2); opacity: 0; } }
  #overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.55); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #overlay.show { display: flex; }
  #box { background: #fbfaf7; color: #222; padding: 20px 24px; border-radius: 10px; max-width: min(560px, 90vw);
         box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  #box pre { white-space: pre-wrap; font-size: 12px; max-height: 40vh; overflow: auto; background: #eee; padding: 8px; }
  #box .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  #box button, #box a { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #aaa;
                        background: #fff; color: #222; text-decoration: none; cursor: pointer; }
  #box button.primary { background: #2a5d9f; border-color: #2a5d9f; color: #fff; }
  /* touch-screen helpers: on-screen keyboard and swipe-for-arrow-keys */
  /* the part of the window clear of the iPad's status bar and home bar; play.js
     reads its size and keeps the game inside it, since iPadOS 26 blurs what's
     drawn under the status bar */
  #safe { position: fixed; visibility: hidden; pointer-events: none;
          top: env(safe-area-inset-top, 0px); left: env(safe-area-inset-left, 0px);
          right: env(safe-area-inset-right, 0px); bottom: env(safe-area-inset-bottom, 0px); }
  #touchbar { position: fixed; right: calc(6px + env(safe-area-inset-right, 0px));
              bottom: calc(6px + env(safe-area-inset-bottom, 0px)); display: none; gap: 6px; z-index: 5; }
  #touchbar.show { display: flex; }
  #touchbar button { width: 40px; height: 40px; border-radius: 9px; border: 1px solid rgba(255,255,255,.5);
                     background: rgba(30,30,30,.45); color: #fff; font: 20px/1 -apple-system, sans-serif;
                     padding: 0; opacity: .55; touch-action: manipulation; }
  #touchbar button.on { background: rgba(42,93,159,.9); opacity: .9; }
  #touchbar #zoomBtn, #touchbar #hqBtn, #touchbar #fsBtn { display: none; }
  #touchbar #zoomBtn.show, #touchbar #hqBtn.show, #touchbar #fsBtn.show { display: block; }
  /* the smoothed zoom (upscale.js), drawn over the game canvas */
  #hq { position: fixed; left: 0; top: 0; pointer-events: none; }
  #kbd { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0;
         font-size: 16px; /* 16px stops iPad zooming in on focus */ }
  #hint { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); padding: 8px 14px;
          border-radius: 8px; background: rgba(0,0,0,.75); color: #fff; pointer-events: none;
          font: 14px -apple-system, sans-serif; opacity: 0; transition: opacity .3s; }
  #hint.show { opacity: 1; }
  #status { position: fixed; left: 50%; top: 45%; transform: translate(-50%,-50%); color: #aaa;
            font: 14px -apple-system, BlinkMacSystemFont, sans-serif; }
</style>
</head>
<body>
<div id="safe"></div>
<canvas id="screen" tabindex="0"></canvas>
<div id="status">Starting…</div>
<div id="touchbar">
  <button id="fsBtn" title="Full screen" aria-label="Full screen">⤢</button>
  <button id="hqBtn" title="Smooth zoom" aria-label="Smooth zoom">✦</button>
  <button id="zoomBtn" title="Zoom out to the whole screen" aria-label="Zoom out">⊖</button>
  <button id="swipeBtn" title="Swipe = arrow keys" aria-label="Swipe for arrow keys">✥</button>
  <button id="kbdBtn" title="Keyboard" aria-label="Show keyboard">⌨</button>
</div>
<input id="kbd" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
       enterkeyhint="done" aria-hidden="true" tabindex="-1">
<div id="hint"></div>
<div id="overlay"><div id="box"></div></div>
<script src="web/config.js"></script>
<script src="web/store.js"></script>
<script src="web/upscale.js"></script>
<script src="web/play.js"></script>
</body>
</html>
