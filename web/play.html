<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading…</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; position: absolute; left: 0; top: 0; outline: none; image-rendering: pixelated;
           touch-action: none; }
  /* stop iPad's long-press text selection, magnifier and callout menu */
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
         -webkit-tap-highlight-color: transparent; }
  .touch-ring { position: fixed; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
                border: 3px solid rgba(255,255,255,.9); box-shadow: 0 0 0 2px rgba(0,0,0,.5);
                pointer-events: none; animation: touch-ring .4s ease-out forwards; }
  @keyframes touch-ring { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.2); opacity: 0; } }
  #overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.55); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #overlay.show { display: flex; }
  #box { background: #fbfaf7; color: #222; padding: 20px 24px; border-radius: 10px; max-width: min(560px, 90vw);
         box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  #box pre { white-space: pre-wrap; font-size: 12px; max-height: 40vh; overflow: auto; background: #eee; padding: 8px; }
  #box .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  #box button, #box a { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #aaa;
                        background: #fff; color: #222; text-decoration: none; cursor: pointer; }
  #box button.primary { background: #2a5d9f; border-color: #2a5d9f; color: #fff; }
  #status { position: fixed; left: 50%; top: 45%; transform: translate(-50%,-50%); color: #aaa;
            font: 14px -apple-system, BlinkMacSystemFont, sans-serif; }
</style>
</head>
<body>
<canvas id="screen" tabindex="0"></canvas>
<div id="status">Starting…</div>
<div id="overlay"><div id="box"></div></div>
<script src="/web/play.js"></script>
</body>
</html>
